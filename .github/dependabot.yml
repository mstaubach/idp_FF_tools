version: 2
updates:
  # Keep npm dependencies up to date.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Collapse low-risk updates into a single PR to cut review noise; surface
    # major bumps individually since they may carry breaking changes.
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # ESLint 10 removed deprecated RuleContext methods (e.g. getFilename()).
      # eslint-config-next@16.2.10 bundles eslint-plugin-react@7.37.5, which
      # still calls them and crashes lint under ESLint 10. There's no newer
      # stable eslint-config-next yet (only canary/preview). Recheck next
      # time a (non-ignored) eslint-config-next dependabot PR lands -- if its
      # bundled eslint-plugin-react has caught up, try this bump again and
      # remove this ignore.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions used in workflows up to date too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
