name: Claude Code Review

# Runs an automated Claude review on every opened/updated pull request.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the official code-review plugin to post inline review comments.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Pin the model: the action's default resolves to the 1M-context
          # variant (claude-opus-4-8[1m]), which this API key can't access.
          # TEMPORARY: swapped to claude-sonnet-5 to isolate whether the
          # instant is_error:true/$0 failures (2026-07-20/21) are specific
          # to opus-4-8 access, or affect this key/account more broadly.
          claude_args: "--model claude-sonnet-5 --max-turns 5"
